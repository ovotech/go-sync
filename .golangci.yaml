version: "2"
linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - forcetypeassert
    - godox
    - gomoddirectives
    - gomodguard
    - ireturn
    - musttag
    - rowserrcheck
    - testableexamples
    - wastedassign
  settings:
    gomoddirectives:
      replace-local: true
    revive:
      confidence: 0.1
      severity: warning
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
          severity: error
          disabled: false
    funcorder:
      struct-method: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
        path: _test\.go
        text: is too long
      - linters:
          - wrapcheck
        path: _test\.go
        text: error returned from external package is unwrapped
      - linters:
          - nilnil
        path: _test\.go
        text: ' use a sentinel error instead'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/ovotech)
        - blank
        - dot
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
